<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Overdrive Rentals</title>
  <link rel="stylesheet" href="main.css">
</head>

<body>

<header id="siteHeader">
  <button id="navToggle">☰</button>
  <nav id="mainNav">
    <a data-nav href="#fleet">Cars</a>
    <a data-nav href="#faq">FAQ</a>
  </nav>
</header>


<section id="fleet">
  <h1>Fleet</h1>

  <div>
    <button class="pill is-active" data-filter="all">All</button>
    <button class="pill" data-filter="suv">SUV</button>
    <button class="pill" data-filter="electric">EV</button>
  </div>

  <div id="fleetGrid"></div>
</section>


<section>
<form id="bookingForm">

  <input id="pickupDate" type="date">
  <input id="returnDate" type="date">

  <select id="carClass">
    <option value="all">All</option>
    <option value="suv">SUV</option>
    <option value="electric">Electric</option>
  </select>

  <input id="pickupLoc" value="Downtown Depot">

  <button>
    Search
  </button>

</form>

<p id="bookingHint"></p>
</section>


<section id="reviews">
  <button id="dispatchPrev">←</button>

  <div id="dispatch">
    <div id="dispatchTrack"></div>
    <div id="dispatchDots"></div>
  </div>

  <button id="dispatchNext">→</button>
</section>


<section id="faq">
  <div id="accordion"></div>
</section>


<div id="modalBackdrop">

  <div class="modal">

    <button id="modalClose">
      X
    </button>

    <div id="modalBody"></div>

  </div>

</div>


<div id="roadSpine">
  <div id="spineCar"></div>
</div>


<footer>
© <span id="year"></span>
</footer>


<script src="script.js"></script>

</body>
</html>
